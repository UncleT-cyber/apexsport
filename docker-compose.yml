services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: apexsport
      POSTGRES_PASSWORD: apexsport
      POSTGRES_DB: apexsport
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
